[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a3-ultrasound"
version = "1.8.0"
description = "A3 fixed-interface multi-interface state-inference prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10",
    "numpy>=2.4",
  "scipy>=1.17.1",
    "PyYAML>=6.0",
    "pytorch-tcn==1.2.3",
    "tsai==1.0.1",
]

[project.scripts]
a3-review-preflight = "a3_ultrasound.review.sanitizer:main"

[tool.a3.third-party.time-series-library]
repository = "https://github.com/thuml/Time-Series-Library.git"
commit = "4e938a1767106324dd753b2a44832bf870a0252e"
path = "third_party/Time-Series-Library"
usage = "TimesNet full-classifier baseline source"
install_upstream_requirements = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
