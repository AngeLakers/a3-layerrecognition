schema_version: 5
architecture_version: a3-v1.3

assembly:
  head_type: [local_independent, local_pre_independent, vanilla_chain, proposed]
  interfaces: [encode, conditional, infer_exact]
  encoded_contains_labels: false
  model_weights_shared_across_comparisons: false

backbone:
  formal_training_candidates: [resnet1d, inceptiontime, fcn1d]
  smoke_only: [tcn]
  feature_stage:
    default: final_pre_pool
    configurable_when_wrapper_exposes: [stage1, stage2, stage3, final_pre_pool]
  global_pooling_in_a3_path: forbidden
  native_temporal_length_preserved: true
  temporal_interpolation: forbidden
  exact_feature_centers: required
  padding_isolation_test: required

backbone_adapter:
  common_feature_dim: 64
  changes_channels_only: true
  preserves_feature_centers: true
  preserves_feature_mask: true
  local_token_diagnostics: required

reference_dimensions:
  query_hidden_dim: 32
  query_output_dim: 32
  attention_dim: 64
  token_dim: 32
  state_embedding_dim: 32
  prefix_gru_hidden_dim: 32
  correction_hidden_dim: 64
  gate_hidden_dim: 64
  local_base: [32, 32, 1]

indexed_readout:
  attention_dim: 64
  local_branch: query_conditioned_masked_attention
  local_empty_support: fail_fast
  pre_interface_branch: feature_only_masked_attention
  empty_pre_support: learnable_empty_context
  readout_scope: indexed
  pre_query_conditioned: false
  ablations:
    full_waveform: local_independent_only_without_gaussian_prior
    query_conditioned_pre: explicit_nondefault

interface_query:
  metadata_schema: a3-interface-meta-v3
  metadata_fields: 5
  query_fields: [k_over_K, tau_over_T, z_over_zmax]
  output_layer_norm: forbidden
  absolute_interface_id_embedding: false
  K_cap_input: forbidden

responsibility_tokens:
  source_projections: independent
  layer_norms: independent
  post_norm_interface_mask: required
  token_dim: 32
  token_dim_minimum_exclusive: 1

structured_head:
  name: propagation_conditioned_structured_head
  classifier_chain_factorization_claimed_as_original: false
  rho_validation_candidates: [1.0, 2.0, 3.0]
  rho_must_be_finite_and_positive: true
  correction_reads_local_representation_directly: false
  gate_reads_prefix: false
  prefix_encoder: shared_gru_cell
  prefix_hidden_dim: 32
  state_embedding_dim: 32
  trainable_parameters_depend_on_K: false
  engineering_K_cap: 6
  validated_real_specimen_K: [2, 3]
  local_base:
    default: mlp
    hidden_dim: 32
    linear_variant: ablation

exact_enumerator:
  role: deterministic_inference_utility
  engineering_K_cap: 6
  complexity: O(2^K)
  normalization: explicit_logsumexp
  raw_log_normalizer: recorded_before_normalization
  conditional_probability_range: recorded_across_all_paths

loss:
  normalization: per_supervised_sample_supervised_interface_count
  equal_weight_for_each_supervised_sample: true
  label_mask_controls_terms: true
  main_training_requires_all_valid_labels: true
  unknown_prefix_marginalization: not_implemented
  local_auxiliary_loss:
    independent: primary_local_base_only
    local_pre_independent: required
    vanilla_classifier_chain: required
    propagation_conditioned: required
    lambda_validation_candidates: [0.1, 0.3, 1.0]
    lambda_shared_for_vanilla_and_proposed: true
    zero_lambda: explicit_disable_local_auxiliary_ablation_only

head_baselines:
  required: [local_independent, local_pre_independent, vanilla_chain, proposed]
  optional_small_K: [flat_joint]
  legacy_matched_joint_spec: matched_joint_spec.yaml
  local_base:
    architecture: identical_per_model_instance
    weight_sharing_between_models: forbidden
  vanilla_classifier_chain:
    conditional_inputs: [r_loc, r_ctx, prefix_hidden]
    direct_query_to_classifier: forbidden
    gate_token_input: forbidden
  local_pre_independent:
    conditional_inputs: [r_loc, r_ctx]
    prefix_gru: absent
    gate: absent

shortcut_baselines:
  query_only: required
  train_prior: required
  absolute_id: required
